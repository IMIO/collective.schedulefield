# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.12.0"

[gitignore]
extra_lines = """
.lock
.venv
htmlcov/
.mxdev_cache/
requirements.txt
"""

[pyproject]
dependencies_ignores = "['plone.app.layout', 'plone.autoform', 'plone.dexterity', 'plone.restapi', 'plone.supermodel', 'Products.CMFPlacefulWorkflow', 'pytest', 'pytest-cov', 'zest.releaser', 'zestreleaser.towncrier', 'z3c.form', 'zope.component', 'zope.i18nmessageid', 'zope.interface', 'zope.publisher', 'zope.schema']"
dependencies_mappings = [
    "'Plone' = ['Products.CMFPlone', 'Products.CMFCore', 'Products.GenericSetup']",
    "'Products.CMFPlone' = ['Products.Five', 'plone.app.content', 'plone.app.contenttypes', 'plone.app.vocabularies', 'plone.app.uuid', 'plone.app.z3cform', 'plone.autoform', 'plone.base', 'plone.behavior', 'plone.dexterity', 'plone.indexer', 'plone.registry', 'plone.memoize', 'plone.namedfile', 'plone.schema', 'plone.supermodel', 'Products.GenericSetup','z3c.relationfield', 'zope.component', 'zope.i18nmessageid', 'zope.interface', 'zope.lifecycleevent', 'zope.publisher', 'zope.schema']",
]
codespell_ignores = "datas,formated"
extra_lines = """
[tool.coverage.run]
omit = [
    "src/collective/schedulefield/utils.py"
]
"""

[flake8]
extra_lines = """
per-file-ignores = schedule.py:E721
"""

[tox]
test_runner = "pytest"
test_path = "/tests"
test_matrix = {"6.2" = ["3.14", "3.13", "3.12", "3.11", "3.10"]}
constraints_files = {"6.2" = "https://dist.plone.org/release/6.2.3/constraints.txt"}

[github]
# No "circular": pytest-plone requires Products.CMFPlone[test], whose test extra
# (plone.app.testing, plone.app.robotframework...) depends back on CMFPlone.
jobs = [
    "qa",
    "coverage",
    "dependencies",
    "release_ready",
    ]
